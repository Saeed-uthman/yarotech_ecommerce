server {
    listen 80;
    server_name shop.yarotech.com.ng;

    root /var/www/yarotech-frontend/dist/client;
    index index.html;

    # --- SPA fallback: all routes serve index.html ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Cache static assets aggressively ---
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    access_log /var/log/nginx/shop.yarotech.com.ng.access.log;
    error_log  /var/log/nginx/shop.yarotech.com.ng.error.log;
}
