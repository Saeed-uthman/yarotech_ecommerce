server {
    listen 80;
    server_name api-shop.yarotech.com.ng;

    root /var/www/yarotech_ecommerce/api/public;
    index index.php;

    # --- Increase limits for file uploads ---
    client_max_body_size 10M;

    # --- Serve uploaded files directly (bypass PHP) ---
    location /uploads/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri $uri/ =404;
    }

    # --- Block sensitive PHP scripts from web access ---
    location ~* ^/(check_|fix_|deep_fix_|list_|run_|test_|debug_|generate_|migrate_).+\.php$ {
        deny all;
        return 403;
    }

    # --- All API requests go through the front controller ---
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # --- PHP-FPM handler ---
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.1-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;

        # Pass Authorization header to PHP (Nginx strips it by default)
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;

        # Increase timeouts for large uploads
        fastcgi_read_timeout 120;
        fastcgi_send_timeout 120;
    }

    # --- Deny access to .htaccess and dotfiles ---
    location ~ /\. {
        deny all;
    }

    access_log /var/log/nginx/api-shop.yarotech.com.ng.access.log;
    error_log  /var/log/nginx/api-shop.yarotech.com.ng.error.log;
}
